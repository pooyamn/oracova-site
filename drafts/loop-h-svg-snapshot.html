<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The loop</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg:#0E0F11; --card:#15161A; --line:rgba(255,255,255,.34);
    --text:#EDEEF0; --dim:#9DA1A8; --faint:#7C8088; --brand:#FFB454; --card2:#1C1E24;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#FAFAF9; --card:#FFFFFF; --line:rgba(20,22,26,.52); --card2:#F4F4F2;
      --text:#16181D; --dim:#555A63; --faint:#6B7078; --brand:#8A4700; color-scheme: light; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono);
    min-height:100vh; display:grid; place-items:center; padding:24px 20px;
    -webkit-font-smoothing:antialiased; }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>

  <svg viewBox="0 108 1024 178" role="img" aria-labelledby="t d">
    <title id="t">The loop: your board, Augur One in fabric, your agent</title>
    <desc id="d">A single row of four, left to right, threaded by one unbroken ring. On the
    left, your DUT board, with your unmodified firmware on real silicon inside it. Next,
    Augur One, in fabric on one clock domain: an I/O block that emulates every peripheral the
    part reads and measures what it writes, and a world that advances physics at loop rate.
    The ring runs through all of them and crosses the boundary between board and fabric
    twice: inbound, the signals the firmware reads; outbound, the actuators it writes. From
    the machine, a verdict against fixed thresholds leaves with no AI in the checker and
    reaches the agent at the right end of the row. The agent is yours, not supplied by
    Oracova; it writes the scenarios, reads the verdicts, and sends the next build back
    through Augur One, which flashes and resets the part over JTAG or SWD.</desc>

    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse"
              markerWidth="9" markerHeight="9" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
      </marker>
      <marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse"
              markerWidth="9" markerHeight="9" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--brand)"/>
      </marker>
    </defs>

    <!-- everything inside this outline is Augur One; its left edge is the boundary -->
    <rect x="280" y="120" width="486" height="158" rx="12" fill="none"
          stroke="var(--brand)" stroke-width="1.6"/>

    <!-- the ring itself is the arrows: four arcs, continuing behind the blocks -->
    <path d="M254 149.53 A310 44 0 0 1 294 147.21" fill="none" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M524 149.26 A310 44 0 0 1 554 151.57" fill="none" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M554 226.43 A310 44 0 0 1 524 228.74" fill="none" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M294 230.79 A310 44 0 0 1 254 228.47" fill="none" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#a)"/>

    <!-- the legend rides the boundary itself -->
    <rect x="479" y="112.5" width="88" height="15" fill="var(--bg)"/>
    <text x="523" y="124.5" dx="0.6" text-anchor="middle" fill="var(--brand)"
      font-size="12" font-weight="700" letter-spacing="1.2">AUGUR ONE</text>

    <!-- in fabric: both ends of the wire in one block, and the world beside it -->
    <rect x="294" y="134" width="230" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.2"/>
    <text x="409" y="156" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">I/O</text>
    <text x="409" y="178" text-anchor="middle" fill="var(--dim)" font-size="12">SPI &#183; I2C &#183; USART &#183; USB &#183; CAN</text>
    <text x="409" y="196" text-anchor="middle" fill="var(--dim)" font-size="12">ETHERNET &#183; WI-FI &#183; BLUETOOTH</text>
    <text x="409" y="214" text-anchor="middle" fill="var(--dim)" font-size="12">ADC &#183; DAC &#183; PWM</text>
    <text x="409" y="232" text-anchor="middle" fill="var(--dim)" font-size="12">GPIO &#183; QUADRATURE</text>

    <rect x="554" y="134" width="198" height="110" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="1.2"/>
    <text x="653" y="181" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">THE WORLD</text>
    <text x="653" y="204" text-anchor="middle" fill="var(--dim)" font-size="12">physics, in fabric</text>

    <!-- left of the row: the board, and inside it the part running your build -->
    <rect x="4" y="120" width="250" height="158" rx="12" fill="var(--card)" stroke="var(--brand)" stroke-width="1.6"/>
    <rect x="18" y="134" width="222" height="110" rx="10" fill="var(--card2)" stroke="var(--line)" stroke-width="1.2"/>
    <text x="129" y="181" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">YOUR FIRMWARE</text>
    <text x="129" y="204" text-anchor="middle" fill="var(--dim)" font-size="12">unmodified &#183; real silicon</text>
    <text x="129" y="266" text-anchor="middle" fill="var(--brand)" font-size="15" font-weight="700" letter-spacing=".6">YOUR D<tspan font-size="11" font-weight="400" letter-spacing="0" fill="var(--dim)">evice</tspan> U<tspan font-size="11" font-weight="400" letter-spacing="0" fill="var(--dim)">nder</tspan> T<tspan font-size="11" font-weight="400" letter-spacing="0" fill="var(--dim)">est</tspan> BOARD</text>

    <!-- the one thing that leaves the machine -->
    <path d="M766 189 H820" fill="none" stroke="var(--brand)" stroke-width="1.6" marker-end="url(#ab)"/>
    <text x="793" y="169" text-anchor="middle" fill="var(--brand)" font-size="12" letter-spacing="1.2">AGENT</text>
    <text x="793" y="183" text-anchor="middle" fill="var(--brand)" font-size="12" letter-spacing="1.2">EYES</text>

    <!-- right of the row: not our software -->
    <rect x="820" y="120" width="200" height="158" rx="12" fill="none"
          stroke="var(--brand)" stroke-width="1.6"/>
    <text x="838" y="174" fill="var(--brand)" font-size="15" font-weight="700" letter-spacing=".6">AGENT</text>
    <text x="838" y="197" fill="var(--dim)" font-size="12">writes scenarios</text>
    <text x="838" y="215" fill="var(--dim)" font-size="12">reads verdicts</text>

    <!-- the outer loop closes through the machine: Augur One is what puts the build on the part -->
    <path d="M820 262 H254" fill="none" stroke="var(--dim)" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="793" y="242" text-anchor="middle" fill="var(--dim)" font-size="12" letter-spacing="1.2">AGENT</text>
    <text x="793" y="256" text-anchor="middle" fill="var(--dim)" font-size="12" letter-spacing="1.2">HANDS</text>
    <text x="290" y="256" fill="var(--dim)" font-size="12" letter-spacing="1.2">JTAG/SWD</text>
  </svg>

</body>
</html>
