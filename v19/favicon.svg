<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- geometry, not font metrics. one grid:
       content = o(26x30) + gap(6) + bar(6) = 42 tall -> margins 11.
       o is a stroked ellipse (mono bold o is taller than wide);
       bar = o width + 6, centred, sharp corners: the cursor. -->
  <rect width="64" height="64" rx="12.8" fill="#0a0e12"/>
  <ellipse cx="32" cy="26" rx="10" ry="11.5" fill="none" stroke="#d7dee6" stroke-width="6.5"/>
  <rect x="16" y="47" width="32" height="6" fill="#ffb454"/>
</svg>
