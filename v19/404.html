<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Oracova</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bg:#0a0e12; --text:#d7dee6; --dim:#8a97a5; --accent:#ffb454; --line:#1e2a36;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono);
    min-height:100vh; display:grid; place-items:center; padding:24px; }
  .card { max-width:520px; }
  .code { color:var(--accent); font-size:15px; margin-bottom:14px; }
  h1 { font-size:26px; margin-bottom:10px; letter-spacing:-0.01em; }
  p { color:var(--dim); font-size:15px; line-height:1.6; margin-bottom:22px; }
  a.btn { display:inline-block; padding:11px 20px; border-radius:6px; background:var(--accent);
    color:#14100a; text-decoration:none; font-weight:600; font-size:14px; }
  a.plain { color:var(--dim); text-decoration:underline; text-underline-offset:3px; margin-left:16px; font-size:14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="code">verdict&nbsp;&nbsp;FAIL&nbsp;&nbsp;404 &middot; page not found</div>
    <h1>This page isn't on the bench.</h1>
    <p>The URL didn't match any page. What you're probably looking for is on the
    homepage.</p>
    <a class="btn" href="/">oracova_ home</a>
    <a class="plain" href="/demo">live demo</a>
  </div>
</body>
</html>
