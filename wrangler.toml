# Cloudflare Pages config for oracova-site.
#
# The pre-order page needs prices that change without a deploy and orders that live
# somewhere, so the site is no longer a pure static deploy: Functions in functions/
# talk to a D1 database.
#
# One-time setup (already done for this account):
#   npx wrangler d1 create oracova
#   npx wrangler d1 execute oracova --remote --file=db/schema.sql
#   npx wrangler d1 execute oracova --remote --file=db/seed.sql
#   npx wrangler pages secret put ADMIN_TOKEN   # long random string, admin login
#   npx wrangler pages secret put IP_SALT       # random string, salts rate-limit hashes
#
# Local development against a throwaway copy:
#   npx wrangler d1 execute oracova --local --file=db/schema.sql
#   npx wrangler d1 execute oracova --local --file=db/seed.sql
#   npx wrangler pages dev

name = "oracova-site"
compatibility_date = "2026-08-04"
pages_build_output_dir = "v19"

# Per environment on purpose. Pages gives preview deployments the production bindings
# by default, which would have meant the public preview URL writing real reservations
# into the real orders table.
[[env.production.d1_databases]]
binding = "DB"
database_name = "oracova"
database_id = "6b380196-0d81-4323-b6a6-5592bfe0c119"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "oracova-preview"
database_id = "06b9444e-335c-4d3e-9011-7d16658ddfff"
